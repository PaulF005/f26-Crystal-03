<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (userDetail(); as userDetailRef) {
    <div>
      <h2 data-cy="userDetailDetailsHeading"><span>User Detail</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span>ID</span></dt>
        <dd>
          <span>{{ userDetailRef.id }}</span>
        </dd>
        <dt><span>Username</span></dt>
        <dd>
          <span>{{ userDetailRef.username }}</span>
        </dd>
        <dt><span>Email</span></dt>
        <dd>
          <span>{{ userDetailRef.email }}</span>
        </dd>
        <dt><span>Data User</span></dt>
        <dd>
          <span>{{ userDetailRef.dataUser?.id }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
      </button>

      <button type="button" [routerLink]="['/user-detail', userDetailRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
      </button>
    </div>
    }
  </div>
</div>
