<div>
  <h2 id="page-heading" data-cy="UserDetailHeading">
    <span>User Details</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span>Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-user-detail"
        [routerLink]="['/user-detail/new']"
      >
        <fa-icon icon="plus" />
        <span>Create a new User Detail</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-alert />

  @if (userDetails().length === 0) {
  <div class="alert alert-warning" id="no-result">
    <span>No User Details found</span>
  </div>
  } @else {
  <div class="table-responsive table-entities" id="entities">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span>ID</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="username">
            <div class="d-flex">
              <span>Username</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="email">
            <div class="d-flex">
              <span>Email</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="dataUser.id">
            <div class="d-flex">
              <span>Data User</span>
              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        @for (userDetail of userDetails(); track trackId(userDetail)) {
        <tr data-cy="entityTable">
          <td><a [routerLink]="['/user-detail', userDetail.id, 'view']">{{ userDetail.id }}</a></td>
          <td>{{ userDetail.username }}</td>
          <td>{{ userDetail.email }}</td>
          <td>{{ userDetail.dataUser?.id }}</td>
          <td class="text-end">
            <div class="btn-group">
              <a [routerLink]="['/user-detail', userDetail.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                <fa-icon icon="eye" />
                <span class="d-none d-md-inline">View</span>
              </a>

              <a [routerLink]="['/user-detail', userDetail.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                <fa-icon icon="pencil-alt" />
                <span class="d-none d-md-inline">Edit</span>
              </a>

              <button type="submit" (click)="delete(userDetail)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times" />
                <span class="d-none d-md-inline">Delete</span>
              </button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  }
</div>
