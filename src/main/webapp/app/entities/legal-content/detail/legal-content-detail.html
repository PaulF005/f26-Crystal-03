<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (legalContent(); as legalContentRef) {
    <div>
      <h2 data-cy="legalContentDetailsHeading"><span>Legal Content</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span>ID</span></dt>
        <dd>
          <span>{{ legalContentRef.id }}</span>
        </dd>
        <dt><span>Name</span></dt>
        <dd>
          <span>{{ legalContentRef.name }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
      </button>

      <button type="button" [routerLink]="['/legal-content', legalContentRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
      </button>
    </div>
    }
  </div>
</div>
