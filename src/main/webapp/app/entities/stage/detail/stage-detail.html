<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (stage(); as stageRef) {
      <div>
        <h2 data-cy="stageDetailsHeading"><span>Stage</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ stageRef.id }}</span>
          </dd>
          <dt><span>Question</span></dt>
          <dd>
            @if (stage()!.question) {
              <div>
                <a [routerLink]="['/question', stage()!.question?.id, 'view']">{{ stageRef.question?.id }}</a>
              </div>
            }
          </dd>
          <dt><span>Scenario</span></dt>
          <dd>
            @if (stage()!.scenario) {
              <div>
                <a [routerLink]="['/scenario', stage()!.scenario?.id, 'view']">{{ stageRef.scenario?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/stage', stageRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
