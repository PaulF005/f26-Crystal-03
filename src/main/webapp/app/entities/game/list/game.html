<div>
  <h2 id="page-heading" data-cy="GameHeading">
    <span>Games</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span>Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-game"
        [routerLink]="['/game/new']"
      >
        <fa-icon icon="plus" />
        <span>Create a new Game</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-alert />
  <div class="mb-3">
    <label for="topic-filter" class="form-label">Filter by topic</label>
    <select id="topic-filter" class="form-select" (change)="onTopicChange($event)">
      <option value="">All topics</option>
      @for (topic of topics(); track topic.id) {
        <option [value]="topic.id">{{ topic.name }}</option>
      }
    </select>
  </div>
  @if (filteredGames().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span>No Games found</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="id">
              <div class="d-flex">
                <span>ID</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" jhiSortBy="name">
              <div class="d-flex">
                <span>Name</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (game of filteredGames(); track trackId(game)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/game', game.id, 'view']">{{ game.id }}</a>
              </td>
              <td>{{ game.name }}</td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/game', game.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye" />
                    <span class="d-none d-md-inline">View</span>
                  </a>

                  <a [routerLink]="['/game', game.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                    <fa-icon icon="pencil-alt" />
                    <span class="d-none d-md-inline">Edit</span>
                  </a>

                  <button type="submit" (click)="delete(game)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times" />
                    <span class="d-none d-md-inline">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
