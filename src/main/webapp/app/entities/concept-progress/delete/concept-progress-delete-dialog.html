@if (conceptProgress) {
<form name="deleteForm" (ngSubmit)="confirmDelete(conceptProgress.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="conceptProgressDeleteDialogHeading">Confirm delete operation</h4>
  </div>

  <div class="modal-body">
    <jhi-alert-error />
    <p id="jhi-delete-conceptProgress-heading">Are you sure you want to delete Concept Progress {{ conceptProgress.id }}?</p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
      <fa-icon icon="ban" />&nbsp;<span>Cancel</span>
    </button>

    <button id="jhi-confirm-delete-conceptProgress" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <fa-icon icon="times" />&nbsp;<span>Delete</span>
    </button>
  </div>
</form>
}
