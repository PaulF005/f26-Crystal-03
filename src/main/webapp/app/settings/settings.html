<div class="home-header">
  <h1 class="font-title">
    <span>Platform Settings</span>
  </h1>
  <p class="font-body">Adjust your game settings.</p>
</div>

<div class="dashboard-grid">
  <!-- Audio Settings Panel -->
  <div class="dashboard-box settings-panel-box">
    <h2 class="pixel-outline">Audio Configuration</h2>
    <p>Enable or disable game sound effects.</p>

    <div class="mb-3">
      <input type="checkbox" id="muteSound" [(ngModel)]="soundEffectsEnabled" (ngModelChange)="onSoundToggleChange()" />

      <label for="muteSound" class="font-body"> Enable Sound Effects </label>

      <!-- Temporary debugging indicator -->
      <p class="font-body">Sound effects: {{ soundEffectsEnabled ? 'ON' : 'OFF' }}</p>
    </div>
  </div>
</div>
<a class="btn btn-secondary" routerLink="/" appClickSound="/content/sounds/select_neutral.wav"> Back to Dashboard </a>
