<div class="home-header">
  <h1 class="font-title">
    <span>Platform Settings</span>
  </h1>
  <p class="font-body">Adjust your game settings.</p>
</div>

<div class="dashboard-grid">
  <!-- Audio Settings Panel -->
  <div class="dashboard-box settings-panel-box">
    <h2 class="pixel-outline">Audio Configuration</h2>
    <p>Enable or disable game sound effects.</p>

    <div class="form-check form-switch mb-3">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="muteSound"
        [(ngModel)]="soundEffectsEnabled"
        (change)="onSoundToggleChange()"
      />
      <label class="form-check-label font-body" for="muteSound"> Enable Sound Effects </label>
    </div>
  </div>
</div>

<!-- Navigation Controls Footer -->
<div class="mt-4 text-start">
  <a class="btn btn-secondary" routerLink="/"> Back to Dashboard </a>
</div>
