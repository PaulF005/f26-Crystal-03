<div class="dashboard-box game-box">
  <h2 class="pixel-outline">{{ name() }}</h2>

  <img class="game-thumbnail" [src]="thumbnail()" [alt]="name() + ' thumbnail'" />

  <div class="game-content">
    <p class="game-description">{{ description() }}</p>

    <div class="game-meta">
      <div>
        <span class="game-meta-label">Status:</span>
        {{ status() }}
      </div>

      <div>
        <span class="game-meta-label">Experience:</span>
        {{ experience() }}
      </div>
    </div>
  </div>
</div>
